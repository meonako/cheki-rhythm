<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>82 Rhythm - Catherine Theme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: 'Press Start 2P', cursive;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px; /* 아이패드/태블릿 화면비에 맞추어 살짝 확장 */
      height: 100vh;
      height: 100dvh;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 4px solid #ff007f; /* 캐서린 핫핑크 테두리 */
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.6), inset 0 0 15px rgba(255, 0, 127, 0.4);
    }

    #hud {
      position: relative;
      height: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      background-color: #000000;
      border-bottom: 3px solid #ff007f;
      font-size: 0.75rem;
      z-index: 10;
      flex-shrink: 0;
    }

    #score { color: #ffffff; text-shadow: 0 0 8px #ff007f; }
    #combo { color: #ff66b2; text-shadow: 0 0 8px #ff007f; }

    #canvas-wrapper {
      position: relative;
      width: 100%;
      height: calc(100% - 50px);
      background-color: #000000;
      overflow: hidden;
    }

    canvas {
      position: relative;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      background-color: #000000;
      z-index: 2;
    }

    .screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.94); 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      z-index: 999;
    }

    .hidden { display: none !important; }

    h1 {
      color: #ffffff;
      font-family: 'Shrikhand', 'Press Start 2P', cursive;
      font-size: 2.4rem;
      margin-bottom: 15px;
      line-height: 1.4;
      text-shadow: 4px 4px 0px #ff007f, -2px -2px 0px #000;
      letter-spacing: 2px;
    }

    .start-btn {
      background-color: #ff007f;
      color: #ffffff;
      border: 3px solid #ffffff;
      padding: 14px 24px;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: 'Press Start 2P', cursive;
      margin: 10px 0;
      box-shadow: 4px 4px 0px #ffffff;
      transition: 0.1s;
    }

    .start-btn:hover, .start-btn:active {
      background-color: #ffffff;
      color: #ff007f;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #ff007f;
    }
     
    h2 {
      color: #ffb3d9;
      font-size: 0.75rem;
      margin-bottom: 25px;
      letter-spacing: 2px;
    }

    .song-select-btn {
      background-color: rgba(255, 0, 127, 0.15);
      color: #ffffff;
      border: 2px solid #ff007f;
      font-family: 'Press Start 2P', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      margin-bottom: 15px;
      padding: 12px 18px;
      width: 85%;
      max-width: 300px;
      word-break: keep-all;
      box-shadow: 3px 3px 0px #ff007f;
      transition: all 0.1s;
    }

    .song-select-btn:hover, .song-select-btn:active {
      background-color: #ff007f;
      color: #ffffff;
      transform: scale(1.03);
      box-shadow: 5px 5px 0px #ffffff;
    }

    /* 캐서린 무드 배경 비네팅 오버레이 */
    .catherine-bg-fx {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255,0,127,0.15) 0%, rgba(0,0,0,0.85) 85%);
      z-index: 1;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div class="catherine-bg-fx"></div>
  <div id="hud">
    <div>SCORE: <span id="score">000000</span></div>
    <div><span id="combo">0</span> COMBO</div>
  </div>

  <div id="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>

    <!-- 1단계: 시작 화면 -->
    <div id="start-screen" class="screen">
      <h1>82 RHYTHM</h1>
      <h2>♥ CATHERINE EDITION ♥</h2>
      <button id="start-game-btn" class="start-btn">START GAME</button>
    </div>

    <!-- 2단계: 곡 선택 화면 -->
    <div id="song-select-screen" class="screen hidden">
      <h1>SELECT SONG</h1>
      <h2>CHOOSE YOUR DESIRE</h2>
      
      <button class="song-select-btn" data-song="gossip">> GOSSIP</button>
      <button class="song-select-btn" data-song="trembling">> 떨리는 맘</button>
    </div>

    <!-- 3단계: 랭크/결과 화면 -->
    <div id="result-screen" class="screen hidden"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('canvas-wrapper');

let width, height, laneWidth, judgeLineY;

function resize() {
  width = canvas.width = wrapper.clientWidth;
  height = canvas.height = wrapper.clientHeight;
  laneWidth = width / 4;
  judgeLineY = height - 110;
}
window.addEventListener('resize', resize);
resize();

const bgImage = new Image();
let isBgLoaded = false;
bgImage.onload = () => { isBgLoaded = true; };
bgImage.src = './cover.png';

const songs = {
  gossip: {
    src: './Gossip.mp3',
    bg: './cover.png',
    pattern: generatePattern(93.06, 99.38, 3.90, 82)
  },
  trembling: {
    src: './trembling.mp3',
    bg: './images/Cover2.png',
    pattern: generatePattern(188.69, 78.30, 0.74, 27)
  }
};

let activeSongKey = 'gossip';
let currentBgm = new Audio();
const NOTE_SPEED = 550;

function generatePattern(duration, bpm, offset, seed) {
  const pattern = [];
  const beat = 60 / bpm;
  let state = seed >>> 0;
  let previousLane = -1;
  let previousDouble = -1;

  function rand() {
    state = (state * 1664525 + 1013904223) >>> 0;
    return state / 4294967296;
  }

  function pickLane(exclude = []) {
    const choices = [0, 1, 2, 3].filter(
      lane => !exclude.includes(lane)
    );
    return choices[Math.floor(rand() * choices.length)];
  }

  let beatIndex = 0;

  for (
    let time = offset;
    time < duration - 0.2;
    time += beat, beatIndex++
  ) {
    const variation = rand();
    if (variation < 0.10 && beatIndex % 4 !== 0) {
      continue;
    }

    const lane = pickLane([previousLane]);
    pattern.push({ t: time, l: lane });
    previousLane = lane;

    if (rand() < 0.30) {
      const offbeat = time + beat / 2;
      if (offbeat < duration - 0.2) {
        const nextLane = pickLane([previousLane]);
        pattern.push({ t: offbeat, l: nextLane });
        previousLane = nextLane;
      }
    }

    if (
      rand() < 0.13 &&
      beatIndex !== previousDouble
    ) {
      const secondLane = pickLane([lane]);
      pattern.push({ t: time, l: secondLane });
      previousDouble = beatIndex;
    }
  }

  return pattern
    .sort((a, b) => a.t - b.t || a.l - b.l)
    .map(note => ({
      time: Number(note.t.toFixed(3)),
      lane: note.l
    }));
}

let isPlaying = false;
let startTime = 0;
let score = 0;
let combo = 0;
let maxCombo = 0;
let perfectCount = 0;
let greatCount = 0;
let missCount = 0;
let activeNotes = [];
let effects = [];

function goToSongSelect() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('song-select-screen').classList.remove('hidden');
  document.getElementById('result-screen').classList.add('hidden');
}

function startGame(songKey) {
  activeSongKey = songKey;
  const selectedSong = songs[songKey];
  if (!selectedSong) return;

  score = 0;
  combo = 0;
  maxCombo = 0;
  perfectCount = 0;
  greatCount = 0;
  missCount = 0;
  effects = [];
  
  isBgLoaded = false;
  bgImage.src = selectedSong.bg;
  bgImage.onload = () => { isBgLoaded = true; };

  activeNotes = selectedSong.pattern.map(n => ({ ...n, hit: false, missed: false }));
  
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('song-select-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');

  document.getElementById('score').innerText = '000000';
  document.getElementById('combo').innerText = '0';

  currentBgm.src = selectedSong.src;
  currentBgm.currentTime = 0;
  
  const playPromise = currentBgm.play();
  if (playPromise !== undefined) {
    playPromise.catch(error => {
      console.log("Audio play blocked or loading error:", error);
    });
  }
  
  currentBgm.onended = () => { endGame(); };

  isPlaying = true;
  startTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function updateHUD() {
  document.getElementById('score').innerText = String(score).padStart(6, '0');
  document.getElementById('combo').innerText = combo;
}

function addEffect(lane, text) {
  effects.push({
    x: lane * laneWidth + laneWidth / 2,
    y: judgeLineY - 20,
    text: text,
    alpha: 1.0
  });
}

function gameLoop(timestamp) {
  if (!isPlaying) return;

  const currentTime = currentBgm.currentTime;

  if (currentBgm.ended || currentTime >= currentBgm.duration) {
    endGame();
    return;
  }

  ctx.clearRect(0, 0, width, height);

  if (isBgLoaded) {
    ctx.drawImage(bgImage, 0, 0, width, height);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, 0, width, height);
  } else {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, width, height);
  }

  // 캐서린 네온 핑크 레인 라인
  ctx.strokeStyle = 'rgba(255, 0, 127, 0.35)';
  ctx.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(i * laneWidth, 0);
    ctx.lineTo(i * laneWidth, height);
    ctx.stroke();
  }

  // 강렬한 핫핑크 판정선
  ctx.strokeStyle = '#ff007f';
  ctx.lineWidth = 5;
  ctx.shadowColor = '#ff007f';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.moveTo(0, judgeLineY);
  ctx.lineTo(width, judgeLineY);
  ctx.stroke();
  ctx.shadowBlur = 0;

  activeNotes.forEach(note => {
    if (note.hit) return;

    const timeDiff = note.time - currentTime;
    const noteY = judgeLineY - (timeDiff * NOTE_SPEED);
    const noteHeight = 20;

    if (timeDiff < -0.18 && !note.missed) {
      note.missed = true;
      combo = 0;
      missCount++;
      addEffect(note.lane, 'MISS');
      updateHUD();
    }

    if (noteY > -20 && noteY < height + 20 && !note.missed) {
      const x = note.lane * laneWidth + 6;
      const w = laneWidth - 12;
      const mainColor = (note.lane === 0 || note.lane === 3) ? '#ffffff' : '#ff007f';
      const glowColor = (note.lane === 0 || note.lane === 3) ? '#ffb3d9' : '#ffffff';

      ctx.save();
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = 12;

      ctx.fillStyle = mainColor;
      ctx.fillRect(x, noteY - noteHeight / 2, w, noteHeight);

      // 노트 내부 포인트 디자인
      ctx.fillStyle = '#000000';
      ctx.fillRect(x + 4, noteY - 3, w - 8, 6);

      ctx.restore();
    }
  });

  for (let i = effects.length - 1; i >= 0; i--) {
    const eff = effects[i];
    ctx.save();
    ctx.font = '11px "Press Start 2P"';
    ctx.textAlign = 'center';
    
    if (eff.text === 'MISS') {
      ctx.fillStyle = `rgba(255, 60, 60, ${eff.alpha})`;
      ctx.shadowColor = '#ff0000';
    } else if (eff.text === 'PERFECT') {
      ctx.fillStyle = `rgba(255, 255, 255, ${eff.alpha})`;
      ctx.shadowColor = '#ff007f';
      ctx.shadowBlur = 8;
    } else {
      ctx.fillStyle = `rgba(255, 180, 220, ${eff.alpha})`;
    }

    ctx.fillText(eff.text, eff.x, eff.y);
    ctx.restore();

    eff.y -= 1;
    eff.alpha -= 0.04;
    if (eff.alpha <= 0) effects.splice(i, 1);
  }

  requestAnimationFrame(gameLoop);
}

function triggerInput(lane) {
  if (!isPlaying) return;

  const currentTime = currentBgm.currentTime;
  const target = activeNotes.find(n => n.lane === lane && !n.hit && !n.missed);

  if (target) {
    const diff = Math.abs(target.time - currentTime);
    
    if (diff <= 0.15) {
      target.hit = true;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      
      const isPerfect = diff <= 0.07;
      if (isPerfect) {
        perfectCount++;
        score += 1000;
      } else {
        greatCount++;
        score += 500;
      }
      
      addEffect(lane, isPerfect ? 'PERFECT' : 'GREAT');
      updateHUD();
    }
  }
}

function endGame() {
  if (!isPlaying) return;
  isPlaying = false;
  try { currentBgm.pause(); } catch(e) {}

  const totalNotes = songs[activeSongKey].pattern.length;
  const maxPossibleScore = totalNotes * 1000;
  const accuracy = maxPossibleScore > 0 ? (score / maxPossibleScore) * 100 : 0;

  let rank = 'F';
  let message = '"STAGE FAILED... TRY AGAIN!"';
  if (accuracy >= 90) { rank = 'S'; message = '"AMAZING! PERFECT DESIRE!"'; }
  else if (accuracy >= 80) { rank = 'A'; message = '"GREAT JOB!"'; }
  else if (accuracy >= 70) { rank = 'B'; message = '"GOOD!"'; }
  else if (accuracy >= 60) { rank = 'C'; message = '"CLEAR!"'; }

  let rankColor = '#ffffff'; 
  let shadowColor = '#ff007f';

  if (rank === 'S') { rankColor = '#ffffff'; shadowColor = '#ff007f'; } 
  else if (rank === 'A') { rankColor = '#ffffff'; shadowColor = '#ff66b2'; } 
  else if (rank === 'B') { rankColor = '#ffffff'; shadowColor = '#00fff2'; } 
  else if (rank === 'C') { rankColor = '#ffffff'; shadowColor = '#ff8800'; } 

  const resultScreen = document.getElementById('result-screen');
  resultScreen.innerHTML = `
    <div style="font-size: 4.5rem; font-family: 'Shrikhand'; color: ${rankColor}; text-shadow: 0 0 15px ${shadowColor}; margin-bottom: 5px;">${rank}</div>
    <div style="font-size: 0.65rem; color: #ffb3d9; margin-bottom: 20px;">${message}</div>
    
    <div style="font-size: 0.65rem; line-height: 2.2; margin-bottom: 25px; text-align: left; background: rgba(255,0,127,0.1); padding: 12px 20px; border: 2px solid #ff007f;">
      <p style="color:#ffffff;">PERFECT : ${perfectCount}</p>
      <p style="color:#ffb3d9;">GREAT   : ${greatCount}</p>
      <p style="color:#ff4444;">MISS    : ${missCount}</p>
      <hr style="border: 0; border-top: 1px dashed #ff007f; margin: 5px 0;">
      <p style="color:#ff007f;">MAX COMBO : ${maxCombo}</p>
    </div>
    <div>
      <button id="retry-btn" class="start-btn">RETRY</button><br>
      <button id="select-song-btn" class="start-btn">SELECT SONG</button>
    </div>
  `;
  resultScreen.classList.remove('hidden');

  document.getElementById('retry-btn').addEventListener('click', () => startGame(activeSongKey));
  document.getElementById('retry-btn').addEventListener('touchend', (e) => { e.preventDefault(); startGame(activeSongKey); });

  document.getElementById('select-song-btn').addEventListener('click', goToSongSelect);
  document.getElementById('select-song-btn').addEventListener('touchend', (e) => { e.preventDefault(); goToSongSelect(); });
}

// 모바일 터치 및 클릭 이벤트 안전 바인딩
document.getElementById('start-game-btn').addEventListener('click', goToSongSelect);
document.getElementById('start-game-btn').addEventListener('touchend', (e) => {
  e.preventDefault();
  goToSongSelect();
});

document.querySelectorAll('.song-select-btn').forEach(btn => {
  const songKey = btn.getAttribute('data-song');
  btn.addEventListener('click', () => startGame(songKey));
  btn.addEventListener('touchend', (e) => {
    e.preventDefault();
    startGame(songKey);
  });
});

const keyMap = {
  d: 0, f: 1, j: 2, k: 3
};

document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (!(key in keyMap)) return;
  e.preventDefault();
  if (!isPlaying) return;
  triggerInput(keyMap[key]);
});

// 아이패드 멀티터치 완벽 대응 (여러 손가락으로 동시에 레인을 누를 때 처리)
canvas.addEventListener('touchstart', (e) => {
  if (!isPlaying) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  for (let i = 0; i < e.touches.length; i++) {
    const touchX = e.touches[i].clientX;
    const lane = Math.floor((touchX - rect.left) / laneWidth);
    if (lane >= 0 && lane < 4) triggerInput(lane);
  }
}, { passive: false });

canvas.addEventListener('mousedown', (e) => {
  if (!isPlaying) return;
  const rect = canvas.getBoundingClientRect();
  const lane = Math.floor((e.clientX - rect.left) / laneWidth);
  if (lane >= 0 && lane < 4) triggerInput(lane);
});
</script>

</body>
</html>
