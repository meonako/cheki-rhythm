
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>82 Rhythm</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

body {
  background: #000;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  font-family: 'Press Start 2P', cursive;
}

#game-container {
  position: relative;
  width: 100%;
  max-width: 430px;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #000;
  border: 2px solid #FF69C7;
  box-shadow: 0 0 20px rgba(255,105,199,.4);
}

#hud {
  height: 45px;
  flex-shrink: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 15px;
  background: #000;
  border-bottom: 2px solid #FDC7FB;
  font-size: .7rem;
  z-index: 10;
}

#score { color: #ffd700; }
#combo { color: #fcd3f2; }

#canvas-wrapper {
  position: relative;
  flex: 1;
  min-height: 0;
  width: 100%;
  overflow: hidden;
  background: #000;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  background: #000;
}

.screen {
  position: absolute;
  inset: 0;
  z-index: 999;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
  background: rgba(0,0,0,.95);
}

.hidden { display: none !important; }

h1 {
  color: #fcd3f2;
  font-size: 2rem;
  margin-bottom: 15px;
  line-height: 1.5;
  text-shadow: 3px 3px #FF69C7;
}

h2 {
  color: #fff;
  font-size: .75rem;
  margin-bottom: 25px;
}

.start-btn, .song-select-btn {
  border: 0;
  background: transparent;
  color: #fff;
  font-family: 'Press Start 2P', cursive;
  font-size: .9rem;
  padding: 12px 20px;
  margin: 8px 0;
  cursor: pointer;
  touch-action: manipulation;
}

.song-select-btn {
  font-size: 1rem;
  margin-bottom: 20px;
  word-break: keep-all;
}

.start-btn:active, .song-select-btn:active {
  color: #FF69C7;
  transform: scale(1.05);
}
</style>
</head>

<body>
<div id="game-container">
  <div id="hud">
    <div>SCORE: <span id="score">000000</span></div>
    <div><span id="combo">0</span> COMBO</div>
  </div>

  <div id="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>

    <div id="start-screen" class="screen">
      <h1>82 RHYTHM</h1>
      <h2>2026 WORK BY YUN</h2>
      <button id="start-game-btn" class="start-btn">START GAME</button>
    </div>

    <div id="song-select-screen" class="screen hidden">
      <h1>SELECT SONG</h1>
      <h2>CHOOSE YOUR TRACK</h2>
      <button class="song-select-btn" data-song="gossip">&gt; GOSSIP</button>
      <button class="song-select-btn" data-song="trembling">&gt; 떨리는 맘</button>
    </div>

    <div id="result-screen" class="screen hidden"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('canvas-wrapper');

let width, height, laneWidth, judgeLineY;
let lastFrameTime = 0;
let animationId = null;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  width = wrapper.clientWidth;
  height = wrapper.clientHeight;

  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  laneWidth = width / 4;
  judgeLineY = height - 105;
}

window.addEventListener('resize', resize);
resize();

// 배경
const bgImage = new Image();
let isBgLoaded = false;

bgImage.onload = () => { isBgLoaded = true; };
bgImage.onerror = () => { isBgLoaded = false; };
bgImage.src = './cover.png';

function generatePattern(duration, bpm, offset, seed) {
  const pattern = [];
  const beat = 60 / bpm;

  let state = seed >>> 0;
  let previousLane = -1;
  let previousDouble = -1;

  function rand() {
    state = (state * 1664525 + 1013904223) >>> 0;
    return state / 4294967296;
  }

  function pickLane(exclude = []) {
    const choices = [0,1,2,3].filter(
      lane => !exclude.includes(lane)
    );
    return choices[Math.floor(rand() * choices.length)];
  }

  let beatIndex = 0;

  for (
    let time = offset;
    time < duration - 0.2;
    time += beat, beatIndex++
  ) {
    if (rand() < 0.10 && beatIndex % 4 !== 0) continue;

    const lane = pickLane([previousLane]);

    pattern.push({t: time, l: lane});
    previousLane = lane;

    if (rand() < 0.30) {
      const offbeat = time + beat / 2;

      if (offbeat < duration - 0.2) {
        const nextLane = pickLane([previousLane]);

        pattern.push({t: offbeat, l: nextLane});
        previousLane = nextLane;
      }
    }

    if (rand() < 0.13 && beatIndex !== previousDouble) {
      const secondLane = pickLane([lane]);

      pattern.push({t: time, l: secondLane});
      previousDouble = beatIndex;
    }
  }

  return pattern
    .sort((a,b) => a.t - b.t || a.l - b.l)
    .map(n => ({
      time: Number(n.t.toFixed(3)),
      lane: n.l
    }));
}

const songs = {
  gossip: {
    src: './Gossip.mp3',
    bg: './cover.png',
    pattern: generatePattern(93.06, 99.38, 3.90, 82)
  },
  trembling: {
    src: './trembling.mp3',
    bg: './images/Cover2.png',
    pattern: generatePattern(188.69, 78.30, 0.74, 27)
  }
};

let activeSongKey = 'gossip';
let currentBgm = new Audio();
const NOTE_SPEED = 550;

let isPlaying = false;
let score = 0;
let combo = 0;
let maxCombo = 0;
let perfectCount = 0;
let greatCount = 0;
let missCount = 0;

let activeNotes = [];
let effects = [];
let particles = [];

// ========================================
// 화려한 판정 이펙트
// 타일 자체는 평소와 동일한 사각형으로 유지
// ========================================

const TAU = Math.PI * 2;

function addEffect(lane, type) {
  const x = lane * laneWidth + laneWidth / 2;

  const perfect = type === 'PERFECT';

  effects.push({
    x,
    y: judgeLineY,
    type,
    age: 0,
    duration: perfect ? 780 : 620,
    seed: Math.random() * TAU
  });

  // 별가루가 중심에서 사방으로 튀어나옴
  const count = perfect ? 32 : 21;

  for (let i = 0; i < count; i++) {
    const angle = Math.random() * TAU;
    const speed = 90 + Math.random() * (perfect ? 290 : 210);

    particles.push({
      x: x + (Math.random() - 0.5) * 12,
      y: judgeLineY + (Math.random() - 0.5) * 12,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 1.5 + Math.random() * (perfect ? 4 : 3),
      rotation: Math.random() * TAU,
      spin: (Math.random() - 0.5) * 9,
      life: 0,
      duration: 350 + Math.random() * 430,
      shape: Math.random() < 0.72 ? 'star' : 'diamond',
      color: Math.random() < 0.45
        ? '#FFFFFF'
        : Math.random() < 0.5
          ? '#FF83E4'
          : '#65F8FF'
    });
  }
}

function drawStar(x, y, outer, inner, rotation = 0) {
  ctx.beginPath();

  for (let i = 0; i < 8; i++) {
    const angle = rotation - Math.PI / 2 + i * Math.PI / 4;
    const radius = i % 2 === 0 ? outer : inner;
    const px = x + Math.cos(angle) * radius;
    const py = y + Math.sin(angle) * radius;

    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }

  ctx.closePath();
}

function drawDiamond(x, y, size, rotation = 0) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);

  ctx.beginPath();
  ctx.moveTo(0, -size * 1.7);
  ctx.lineTo(size * 0.7, 0);
  ctx.lineTo(0, size * 1.7);
  ctx.lineTo(-size * 0.7, 0);
  ctx.closePath();

  ctx.restore();
}

function drawEffects(dt) {
  // 링과 플래시
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];

    e.age += dt;

    const p = Math.min(e.age / e.duration, 1);
    const fade = Math.pow(1 - p, 0.8);
    const perfect = e.type === 'PERFECT';

    const pink = '#FF69D4';
    const cyan = '#57F5FF';

    ctx.save();

    // 링은 화면보다 커지지 않도록 자연스럽게 확대
    ctx.globalAlpha = fade;

    // 1. 중앙의 강렬한 빛
    if (p < 0.35) {
      const flashP = p / 0.35;
      const radius = 16 + flashP * 54;

      const flash = ctx.createRadialGradient(
        e.x, e.y, 0,
        e.x, e.y, radius
      );

      flash.addColorStop(0, 'rgba(255,255,255,0.98)');
      flash.addColorStop(0.12, 'rgba(255,255,255,0.8)');
      flash.addColorStop(0.38, perfect
        ? 'rgba(255,105,212,0.55)'
        : 'rgba(87,245,255,0.55)');
      flash.addColorStop(1, 'rgba(255,105,212,0)');

      ctx.fillStyle = flash;
      ctx.beginPath();
      ctx.arc(e.x, e.y, radius, 0, TAU);
      ctx.fill();
    }

    // 2. 겹쳐지는 네온 링
    // 사진처럼 중심을 감싸는 타원형 링
    for (let r = 0; r < 4; r++) {
      const rp = Math.min(1, p + r * 0.11);
      const radius = 13 + rp * (perfect ? 78 : 60);
      const ry = radius * 0.58;

      ctx.beginPath();
      ctx.ellipse(
        e.x, e.y,
        radius, ry,
        0, 0, TAU
      );

      const color = r % 2 === 0 ? pink : cyan;

      ctx.strokeStyle = color;
      ctx.lineWidth = (r === 0 ? 5 : 2.4) * (1 - rp) + 0.3;
      ctx.shadowColor = color;
      ctx.shadowBlur = r === 0 ? 25 : 13;
      ctx.stroke();
    }

    ctx.shadowBlur = 0;

    // 3. 이중 파동: 얇은 원형 파장이 바깥으로 퍼짐
    for (let r = 0; r < 3; r++) {
      const rp = Math.min(1, p * 1.2 + r * 0.2);
      const radius = 18 + rp * 88;

      ctx.beginPath();
      ctx.ellipse(
        e.x, e.y,
        radius, radius * 0.63,
        0, 0, TAU
      );

      ctx.strokeStyle = r % 2 === 0
        ? 'rgba(255,255,255,0.9)'
        : 'rgba(255,140,235,0.85)';

      ctx.lineWidth = (1 - rp) * 2 + 0.2;
      ctx.stroke();
    }

    // 4. 중심에서 바깥으로 뻗는 광선
    const rayCount = perfect ? 28 : 20;

    for (let r = 0; r < rayCount; r++) {
      const angle = TAU * r / rayCount + e.seed;
      const inner = 9 + p * 23;
      const outer = inner + (1 - p) * (
        r % 3 === 0 ? 105 : 65
      );

      const x1 = e.x + Math.cos(angle) * inner;
      const y1 = e.y + Math.sin(angle) * inner * 0.7;
      const x2 = e.x + Math.cos(angle) * outer;
      const y2 = e.y + Math.sin(angle) * outer * 0.7;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);

      ctx.strokeStyle = r % 3 === 0
        ? '#FFFFFF'
        : r % 2 === 0 ? pink : cyan;

      ctx.lineWidth = r % 4 === 0 ? 2.7 : 1.2;
      ctx.shadowColor = ctx.strokeStyle;
      ctx.shadowBlur = 12;
      ctx.stroke();
    }

    ctx.shadowBlur = 0;

    // 5. 네 방향으로 강하게 번쩍이는 십자 플래시
    if (p < 0.42) {
      const fp = p / 0.42;
      const length = 12 + fp * 66;

      ctx.globalAlpha = (1 - fp) * 0.9;

      const gradH = ctx.createLinearGradient(
        e.x - length, e.y,
        e.x + length, e.y
      );

      gradH.addColorStop(0, 'rgba(255,255,255,0)');
      gradH.addColorStop(0.5, '#FFFFFF');
      gradH.addColorStop(1, 'rgba(255,255,255,0)');

      ctx.fillStyle = gradH;
      ctx.fillRect(e.x - length, e.y - 2, length * 2, 4);

      const gradV = ctx.createLinearGradient(
        e.x, e.y - length,
        e.x, e.y + length
      );

      gradV.addColorStop(0, 'rgba(255,255,255,0)');
      gradV.addColorStop(0.5, '#FFFFFF');
      gradV.addColorStop(1, 'rgba(255,255,255,0)');

      ctx.fillStyle = gradV;
      ctx.fillRect(e.x - 2, e.y - length, 4, length * 2);
    }

    // 6. 링을 따라 반짝이는 별들
    const starCount = perfect ? 12 : 8;

    for (let s = 0; s < starCount; s++) {
      const angle = TAU * s / starCount + e.seed;
      const distance = 18 + p * (perfect ? 82 : 62);

      const sx = e.x + Math.cos(angle) * distance;
      const sy = e.y + Math.sin(angle) * distance * 0.6;
      const starSize = (perfect ? 7 : 5) * fade + 0.2;

      drawStar(sx, sy, starSize, starSize * 0.28, angle);

      ctx.fillStyle = s % 3 === 0 ? '#FFFFFF' : pink;
      ctx.shadowColor = cyan;
      ctx.shadowBlur = 16;
      ctx.fill();
    }

    // 7. 판정 글씨
    ctx.globalAlpha = Math.max(0, 1 - p * 1.35);
    ctx.font = '10px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#FFFFFF';
    ctx.shadowColor = perfect ? pink : cyan;
    ctx.shadowBlur = 15;

    ctx.fillText(
      e.type,
      e.x,
      e.y - 38 - p * 27
    );

    ctx.restore();

    if (e.age >= e.duration) {
      effects.splice(i, 1);
    }
  }

  // 8. 별가루와 다이아몬드 파티클
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];

    pt.life += dt;

    const p = Math.min(pt.life / pt.duration, 1);
    const fade = 1 - p;
    const seconds = dt / 1000;

    pt.x += pt.vx * seconds;
    pt.y += pt.vy * seconds;

    pt.vx *= Math.pow(0.08, seconds);
    pt.vy *= Math.pow(0.08, seconds);
    pt.vy += 18 * seconds;
    pt.rotation += pt.spin * seconds;

    ctx.save();
    ctx.globalAlpha = fade;
    ctx.fillStyle = pt.color;
    ctx.shadowColor = pt.color;
    ctx.shadowBlur = 15;

    if (pt.shape === 'star') {
      drawStar(
        pt.x, pt.y,
        pt.size * fade + 0.2,
        pt.size * 0.24 * fade + 0.1,
        pt.rotation
      );
    } else {
      ctx.translate(pt.x, pt.y);
      ctx.rotate(pt.rotation);
      ctx.beginPath();
      ctx.moveTo(0, -pt.size);
      ctx.lineTo(pt.size * 0.55, 0);
      ctx.lineTo(0, pt.size);
      ctx.lineTo(-pt.size * 0.55, 0);
      ctx.closePath();
    }

    ctx.fill();
    ctx.restore();

    if (pt.life >= pt.duration) {
      particles.splice(i, 1);
    }
  }
}

// ========================================
// 화면과 게임 시스템
// ========================================

function goToSongSelect() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('song-select-screen').classList.remove('hidden');
  document.getElementById('result-screen').classList.add('hidden');
}

function startGame(songKey) {
  const song = songs[songKey];
  if (!song) return;

  isPlaying = false;

  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  currentBgm.pause();
  currentBgm.onended = null;

  activeSongKey = songKey;
  score = 0;
  combo = 0;
  maxCombo = 0;
  perfectCount = 0;
  greatCount = 0;
  missCount = 0;
  effects = [];
  particles = [];

  isBgLoaded = false;
  bgImage.src = song.bg;

  activeNotes = song.pattern.map(n => ({
    ...n,
    hit: false,
    missed: false
  }));

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('song-select-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');

  updateHUD();

  currentBgm = new Audio(song.src);
  currentBgm.preload = 'auto';
  currentBgm.onended = endGame;

  isPlaying = true;
  lastFrameTime = performance.now();

  currentBgm.play().catch(err => {
    console.log('Audio playback error:', err);
  });

  animationId = requestAnimationFrame(gameLoop);
}

function updateHUD() {
  document.getElementById('score').innerText =
    String(score).padStart(6, '0');

  document.getElementById('combo').innerText = combo;
}

function gameLoop(timestamp) {
  if (!isPlaying) return;

  const dt = Math.min(timestamp - lastFrameTime, 40);
  lastFrameTime = timestamp;

  const currentTime = currentBgm.currentTime;

  ctx.clearRect(0, 0, width, height);

  // 배경
  if (isBgLoaded && bgImage.complete && bgImage.naturalWidth > 0) {
    ctx.drawImage(bgImage, 0, 0, width, height);

    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, width, height);
  } else {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, width, height);
  }

  // 레인
  ctx.strokeStyle = 'rgba(255,105,199,0.25)';
  ctx.lineWidth = 2;

  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(i * laneWidth, 0);
    ctx.lineTo(i * laneWidth, height);
    ctx.stroke();
  }

  // 판정선
  ctx.strokeStyle = '#FF69C7';
  ctx.lineWidth = 4;

  ctx.beginPath();
  ctx.moveTo(0, judgeLineY);
  ctx.lineTo(width, judgeLineY);
  ctx.stroke();

  // 기본 타일은 단순하게 유지
  for (const note of activeNotes) {
    if (note.hit || note.missed) continue;

    const timeDiff = note.time - currentTime;
    const noteY = judgeLineY - timeDiff * NOTE_SPEED;

    if (timeDiff < -0.18) {
      note.missed = true;
      combo = 0;
      missCount++;
      updateHUD();
      continue;
    }

    if (noteY < -20 || noteY > height + 20) continue;

    const x = note.lane * laneWidth + 6;
    const w = laneWidth - 12;
    const color = note.lane === 0 || note.lane === 3
      ? '#FDC7FB'
      : '#FD5DBD';

    ctx.fillStyle = color;
    ctx.fillRect(x, noteY - 9, w, 18);
  }

  // 모든 타일 위에 판정 이펙트 렌더링
  drawEffects(dt);

  animationId = requestAnimationFrame(gameLoop);
}

// ========================================
// 입력 판정
// ========================================

function triggerInput(lane) {
  if (!isPlaying) return;

  const currentTime = currentBgm.currentTime;

  // 같은 레인에서 가장 가까운 미판정 노트 검색
  let target = null;
  let smallestDiff = Infinity;

  for (const note of activeNotes) {
    if (note.lane !== lane || note.hit || note.missed) continue;

    const diff = Math.abs(note.time - currentTime);

    if (diff < smallestDiff) {
      smallestDiff = diff;
      target = note;
    }
  }

  if (!target || smallestDiff > 0.15) return;

  target.hit = true;
  combo++;
  maxCombo = Math.max(combo, maxCombo);

  if (smallestDiff <= 0.07) {
    perfectCount++;
    score += 1000;
    addEffect(lane, 'PERFECT');
  } else {
    greatCount++;
    score += 500;
    addEffect(lane, 'GREAT');
  }

  updateHUD();
}

function endGame() {
  if (!isPlaying) return;

  isPlaying = false;
  currentBgm.pause();

  const totalNotes = songs[activeSongKey].pattern.length;
  const accuracy = totalNotes
    ? score / (totalNotes * 1000) * 100
    : 0;

  let rank = 'F';
  let message = '"STAGE FAILED... TRY AGAIN!"';
  let color = '#ff4444';

  if (accuracy >= 90) {
    rank = 'S';
    message = '"AMAZING! PERFECT RHYTHM!"';
    color = '#ffd700';
  } else if (accuracy >= 80) {
    rank = 'A';
    message = '"GREAT JOB!"';
    color = '#FD5DBD';
  } else if (accuracy >= 70) {
    rank = 'B';
    message = '"GOOD!"';
    color = '#00fff2';
  } else if (accuracy >= 60) {
    rank = 'C';
    message = '"CLEAR!"';
    color = '#ff8800';
  }

  const result = document.getElementById('result-screen');

  result.innerHTML = `
    <div style="font-size:4.5rem;color:white;text-shadow:0 0 20px ${color};margin-bottom:10px">${rank}</div>
    <div style="font-size:.65rem;color:#fcd3f2;margin-bottom:20px">${message}</div>
    <div style="font-size:.65rem;line-height:2.2;text-align:left;margin-bottom:20px">
      <p style="color:#54F7FF">PERFECT : ${perfectCount}</p>
      <p style="color:#fcd3f2">GREAT : ${greatCount}</p>
      <p style="color:#ff4444">MISS : ${missCount}</p>
      <hr style="border:0;border-top:1px solid #555;margin:5px 0">
      <p>MAX COMBO : ${maxCombo}</p>
      <p>SCORE : ${score}</p>
    </div>
    <button id="retry-btn" class="start-btn">RETRY</button>
    <button id="select-song-btn" class="start-btn">SELECT SONG</button>
  `;

  result.classList.remove('hidden');

  document.getElementById('retry-btn').onclick =
    () => startGame(activeSongKey);

  document.getElementById('select-song-btn').onclick =
    goToSongSelect;
}

// ========================================
// 버튼 및 키보드 / 터치
// ========================================

document.getElementById('start-game-btn').addEventListener(
  'click',
  goToSongSelect
);

document.querySelectorAll('.song-select-btn').forEach(btn => {
  btn.addEventListener('click', () => startGame(btn.dataset.song));
});

const keyMap = {
  d: 0,
  f: 1,
  j: 2,
  k: 3
};

window.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();

  if (!(key in keyMap)) return;

  e.preventDefault();

  if (e.repeat) return;

  triggerInput(keyMap[key]);
}, true);

function handlePointer(clientX) {
  if (!isPlaying) return;

  const rect = canvas.getBoundingClientRect();
  const lane = Math.floor(
    (clientX - rect.left) / rect.width * 4
  );

  if (lane >= 0 && lane < 4) {
    triggerInput(lane);
  }
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  handlePointer(e.clientX);
});

</script>
</body>
</html>
