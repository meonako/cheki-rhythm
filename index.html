
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>チェキ☆リズム</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

body {
  background: #000;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  font-family: 'Press Start 2P', cursive;
}

#game-container {
  position: relative;
  width: 100%;
  max-width: 430px;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 2px solid #FF69C7;
  box-shadow: 0 0 20px #ff69c744;
  background: #000;
}

#hud {
  height: 45px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  border-bottom: 2px solid #FDC7FB;
  font-size: 9px;
  z-index: 10;
}

#score { color: #ffd700; }
#combo { color: #fcd3f2; }

#canvas-wrapper {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  background: #000;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.screen {
  position: absolute;
  inset: 0;
  z-index: 20;
  background: rgba(0,0,0,.94);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

.hidden {
  display: none !important;
}

/* 제목 공통 */
h1 {
  color: #fcd3f2;
  line-height: 1.5;
  margin-bottom: 16px;
  text-shadow: 3px 3px #e664b7;
  -webkit-text-stroke: 0.5px #000;
}

/* 일본어 제목: 도트 폰트 */
.jp-title {
  font-family: 'DotGothic16', sans-serif;
  font-size: 40px;
  font-weight: 400;
  line-height: 1.5;
  letter-spacing: 0;
  white-space: nowrap;
  -webkit-text-stroke: 3px #fcd3f2;
  text-shadow: 5px
}

/* 영어 제목 */
.en-title {
  font-family: 'Press Start 2P', cursive;
  font-size: 25px;
  white-space: nowrap;
  letter-spacing: -1px;
}

h2 {
  font-family: 'Press Start 2P', cursive;
  font-size: 10px;
  line-height: 1.8;
  margin-bottom: 25px;
}

/* 버튼 공통 */
.start-btn,
.song-select-btn {
  background: transparent;
  color: white;
  border: none;
  cursor: pointer;
  padding: 12px;
  margin: 5px;
}

.start-btn {
  font-family: 'Press Start 2P', cursive;
  font-size: 11px;
}

.start-btn:active,
.song-select-btn:active {
  color: #FF69C7;
}

/* 일본어 곡 선택 버튼 */
.song-jp {
  font-family: 'DotGothic16', sans-serif;
  font-size: 23px;
  font-weight: 400;
  letter-spacing: 0;
  line-height: 1.6;
  white-space: nowrap;
  text-shadow: 1px 1px 0 #e664b7;
}

/* 작은 화면 대응 */
@media (max-width: 360px) {
  .jp-title {
    font-size: 33px;
  }

  .en-title {
    font-size: 19px;
  }

  h2 {
    font-size: 8px;
  }

  .song-jp {
    font-size: 19px;
    padding: 10px 4px;
  }
}
</style>
</head>

<body>
<div id="game-container">

  <div id="hud">
    <div>SCORE: <span id="score">000000</span></div>
    <div><span id="combo">0</span> COMBO</div>
  </div>

  <div id="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>

    <div id="start-screen" class="screen">
      <h1 class="jp-title">チェキ☆リズム</h1>
      <h2>2026 WORK BY YUN</h2>
      <button id="start-game-btn" class="start-btn">START GAME</button>
    </div>

    <div id="song-select-screen" class="screen hidden">
      <h1 class="en-title">SELECT SONG</h1>
      <h2>CHOOSE YOUR TRACK</h2>
      <button class="song-select-btn song-jp" data-song="Trembling">チェキ☆ラブ (JP)</button>
      <button class="song-select-btn song-jp" data-song="trembling">チェキ☆ラブ (KR)</button>
    </div>

    <div id="result-screen" class="screen hidden"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('canvas-wrapper');

let width, height, laneWidth, judgeLineY;
let dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = wrapper.clientWidth;
  height = wrapper.clientHeight;

  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  laneWidth = width / 4;
  judgeLineY = height - 105;
}

window.addEventListener('resize', resize);
resize();

const bgImage = new Image();
let isBgLoaded = false;

function generatePattern(duration, bpm, offset, seed) {
  const pattern = [];
  const beat = 60 / bpm;
  let state = seed >>> 0;
  let previousLane = -1;
  let previousDouble = -1;

  function rand() {
    state = (state * 1664525 + 1013904223) >>> 0;
    return state / 4294967296;
  }

  function pickLane(exclude = []) {
    const choices = [0, 1, 2, 3].filter(l => !exclude.includes(l));
    return choices[Math.floor(rand() * choices.length)];
  }

  let beatIndex = 0;

  for (let time = offset; time < duration - 0.2; time += beat, beatIndex++) {
    if (rand() < 0.10 && beatIndex % 4 !== 0) continue;

    const lane = pickLane([previousLane]);
    pattern.push({ t: time, l: lane });
    previousLane = lane;

    if (rand() < 0.30) {
      const offbeat = time + beat / 2;

      if (offbeat < duration - 0.2) {
        const nextLane = pickLane([previousLane]);
        pattern.push({ t: offbeat, l: nextLane });
        previousLane = nextLane;
      }
    }

    if (rand() < 0.13 && beatIndex !== previousDouble) {
      pattern.push({ t: time, l: pickLane([lane]) });
      previousDouble = beatIndex;
    }
  }

  return pattern
    .sort((a, b) => a.t - b.t || a.l - b.l)
    .map(n => ({ time: Number(n.t.toFixed(3)), lane: n.l }));
}

const songs = {
  Trembling: {
    src: './Trembling.mp3',
    bg: './cover.png',
    pattern: generatePattern(93.06, 99.38, 3.90, 82)
  },
  trembling: {
    src: './trembling.mp3',
    bg: './images/Cover2.png',
    pattern: generatePattern(188.69, 78.30, 0.74, 27)
  }
};

let activeSongKey = 'Trembling';
let currentBgm = new Audio();

const NOTE_SPEED = 550;

let isPlaying = false;
let score = 0;
let combo = 0;
let maxCombo = 0;
let perfectCount = 0;
let greatCount = 0;
let missCount = 0;
let activeNotes = [];
let effects = [];
let lastFrameTime = 0;

function updateHUD() {
  document.getElementById('score').textContent =
    String(score).padStart(6, '0');

  document.getElementById('combo').textContent = combo;
}

function goToSongSelect() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('song-select-screen').classList.remove('hidden');
  document.getElementById('result-screen').classList.add('hidden');
}

function startGame(songKey) {
  const song = songs[songKey];
  if (!song) return;

  isPlaying = false;

  currentBgm.pause();
  currentBgm.onended = null;

  activeSongKey = songKey;
  score = 0;
  combo = 0;
  maxCombo = 0;
  perfectCount = 0;
  greatCount = 0;
  missCount = 0;
  effects = [];

  activeNotes = song.pattern.map(n => ({
    ...n,
    hit: false,
    missed: false
  }));

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('song-select-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');

  updateHUD();

  bgImage.onload = () => { isBgLoaded = true; };
  bgImage.onerror = () => { isBgLoaded = false; };
  isBgLoaded = false;
  bgImage.src = song.bg;

  currentBgm = new Audio(song.src);
  currentBgm.onended = endGame;

  isPlaying = true;
  lastFrameTime = 0;

  currentBgm.play().catch(err => {
    console.error('Audio error:', err);
  });

  requestAnimationFrame(gameLoop);
}

function drawStar(x, y, outerRadius, innerRadius, rotation = 0) {
  ctx.beginPath();

  for (let i = 0; i < 10; i++) {
    const angle = rotation - Math.PI / 2 + i * Math.PI / 5;
    const radius = i % 2 === 0 ? outerRadius : innerRadius;
    const px = x + Math.cos(angle) * radius;
    const py = y + Math.sin(angle) * radius;

    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }

  ctx.closePath();
}

function addEffect(lane) {
  effects.push({
    x: lane * laneWidth + laneWidth / 2,
    y: judgeLineY,
    age: 0,
    duration: 480,
    stars: Array.from({ length: 5 }, () => ({
      angle: Math.random() * Math.PI * 2,
      distance: 20 + Math.random() * 30,
      size: 6 + Math.random() * 7,
      rotation: Math.random() * Math.PI
    }))
  });
}

function drawEffects(delta) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    e.age += delta;

    const p = Math.min(e.age / e.duration, 1);
    const alpha = 1 - p;
    const radius = 10 + p * 68;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#ff9cf4';
    ctx.lineWidth = Math.max(1, 4 * (1 - p));
    ctx.shadowColor = '#ff69e8';
    ctx.shadowBlur = 22;

    ctx.beginPath();
    ctx.ellipse(e.x, e.y, radius, radius * 0.45, 0, 0, Math.PI * 2);
    ctx.stroke();

    const glow = ctx.createRadialGradient(
      e.x, e.y, 0,
      e.x, e.y, 38 * (1 - p) + 3
    );

    glow.addColorStop(0, `rgba(255,255,255,${alpha})`);
    glow.addColorStop(0.3, `rgba(255,160,245,${alpha * 0.75})`);
    glow.addColorStop(1, 'rgba(255,80,220,0)');

    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(e.x, e.y, 42 * (1 - p) + 3, 0, Math.PI * 2);
    ctx.fill();

    for (const star of e.stars) {
      const dist = star.distance * (0.35 + p * 1.1);
      const sx = e.x + Math.cos(star.angle) * dist;
      const sy = e.y + Math.sin(star.angle) * dist * 0.6;
      const size = star.size * (1 - p * 0.65);

      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#ff75eb';
      ctx.shadowBlur = 18;

      drawStar(sx, sy, size, size * 0.42, star.rotation + p);
      ctx.fill();
    }

    ctx.restore();

    if (e.age >= e.duration) {
      effects.splice(i, 1);
    }
  }
}

function gameLoop(timestamp) {
  if (!isPlaying) return;

  const delta = lastFrameTime
    ? Math.min(timestamp - lastFrameTime, 40)
    : 16;

  lastFrameTime = timestamp;

  if (currentBgm.ended) {
    endGame();
    return;
  }

  const currentTime = currentBgm.currentTime;

  ctx.clearRect(0, 0, width, height);

  if (isBgLoaded && bgImage.complete && bgImage.naturalWidth) {
    ctx.drawImage(bgImage, 0, 0, width, height);
    ctx.fillStyle = 'rgba(0,0,0,0.48)';
    ctx.fillRect(0, 0, width, height);
  } else {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, width, height);
  }

  ctx.strokeStyle = 'rgba(120,210,255,0.13)';
  ctx.lineWidth = 1;

  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(i * laneWidth, 0);
    ctx.lineTo(i * laneWidth, height);
    ctx.stroke();
  }

  ctx.save();
  ctx.shadowColor = '#ff69c7';
  ctx.shadowBlur = 13;
  ctx.strokeStyle = 'rgba(255,160,245,0.95)';
  ctx.lineWidth = 4;

  ctx.beginPath();
  ctx.moveTo(0, judgeLineY);
  ctx.lineTo(width, judgeLineY);
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 1;

  ctx.beginPath();
  ctx.moveTo(0, judgeLineY);
  ctx.lineTo(width, judgeLineY);
  ctx.stroke();
  ctx.restore();

  for (const note of activeNotes) {
    if (note.hit || note.missed) continue;

    const timeDiff = note.time - currentTime;
    const noteY = judgeLineY - timeDiff * NOTE_SPEED;

    if (timeDiff < -0.18) {
      note.missed = true;
      combo = 0;
      missCount++;
      updateHUD();
      continue;
    }

    if (noteY > -40 && noteY < height + 40) {
      const x = note.lane * laneWidth + laneWidth / 2;

      ctx.save();
      ctx.translate(x, noteY);

      const s = Math.min((laneWidth - 18) / 100, 0.28);
      ctx.scale(s, s);

      ctx.strokeStyle = '#ffc4f2';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = '#ff69c7';
      ctx.shadowBlur = 18;

      ctx.beginPath();
      ctx.moveTo(0, -28);
      ctx.lineTo(0, -8);

      ctx.moveTo(0, -8);
      ctx.bezierCurveTo(-12, -23, -37, -22, -37, -3);
      ctx.bezierCurveTo(-37, 10, -17, 25, 0, 38);
      ctx.bezierCurveTo(17, 25, 37, 10, 37, -3);
      ctx.bezierCurveTo(37, -22, 12, -23, 0, -8);

      ctx.moveTo(0, 24);
      ctx.lineTo(0, 43);
      ctx.moveTo(-47, 3);
      ctx.lineTo(-25, 3);
      ctx.moveTo(25, 3);
      ctx.lineTo(47, 3);

      ctx.stroke();
      ctx.restore();
    }
  }

  drawEffects(delta);
  requestAnimationFrame(gameLoop);
}

function triggerInput(lane) {
  if (!isPlaying) return;

  const currentTime = currentBgm.currentTime;

  const target = activeNotes.find(n =>
    n.lane === lane && !n.hit && !n.missed
  );

  if (!target) return;

  const diff = Math.abs(target.time - currentTime);

  if (diff <= 0.15) {
    target.hit = true;

    combo++;
    maxCombo = Math.max(maxCombo, combo);

    if (diff <= 0.07) {
      perfectCount++;
      score += 1000;
    } else {
      greatCount++;
      score += 500;
    }

    addEffect(lane);
    updateHUD();
  }
}

function endGame() {
  if (!isPlaying) return;

  isPlaying = false;
  currentBgm.pause();

  const totalNotes = songs[activeSongKey].pattern.length;
  const accuracy = totalNotes
    ? score / (totalNotes * 1000) * 100
    : 0;

  let rank = 'F';
  let message = 'STAGE FAILED... TRY AGAIN!';
  let color = '#ff4444';

  if (accuracy >= 90) {
    rank = 'S';
    message = 'AMAZING! PERFECT RHYTHM!';
    color = '#ffd700';
  } else if (accuracy >= 80) {
    rank = 'A';
    message = 'GREAT JOB!';
    color = '#FD5DBD';
  } else if (accuracy >= 70) {
    rank = 'B';
    message = 'GOOD!';
    color = '#00fff2';
  } else if (accuracy >= 60) {
    rank = 'C';
    message = 'CLEAR!';
    color = '#ff8800';
  }

  const result = document.getElementById('result-screen');

  result.innerHTML = `
    <div style="font-family:'Press Start 2P',cursive;font-size:65px;color:white;text-shadow:0 0 20px ${color};margin-bottom:10px">${rank}</div>
    <div style="font-size:9px;color:#fcd3f2;line-height:2;margin-bottom:20px">${message}</div>
    <div style="font-size:10px;line-height:2.5;text-align:left;margin-bottom:20px">
      <p style="color:#00fff2">PERFECT : ${perfectCount}</p>
      <p style="color:#fcd3f2">GREAT : ${greatCount}</p>
      <p style="color:#ff4444">MISS : ${missCount}</p>
      <hr style="border:0;border-top:1px solid #555;margin:8px 0">
      <p>MAX COMBO : ${maxCombo}</p>
    </div>
    <button id="retry-btn" class="start-btn">RETRY</button>
    <button id="select-song-btn" class="start-btn">SELECT SONG</button>
  `;

  result.classList.remove('hidden');

  document.getElementById('retry-btn').onclick =
    () => startGame(activeSongKey);

  document.getElementById('select-song-btn').onclick =
    goToSongSelect;
}

document.getElementById('start-game-btn')
  .addEventListener('click', goToSongSelect);

document.querySelectorAll('.song-select-btn').forEach(btn => {
  btn.addEventListener('click', () => startGame(btn.dataset.song));
});

const keyMap = { d: 0, f: 1, j: 2, k: 3 };

document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (!(key in keyMap)) return;

  e.preventDefault();
  triggerInput(keyMap[key]);
});

canvas.addEventListener('pointerdown', e => {
  if (!isPlaying) return;

  e.preventDefault();

  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (width / rect.width);
  const lane = Math.floor(x / laneWidth);

  if (lane >= 0 && lane < 4) triggerInput(lane);
});
</script>
</body>
</html>
